name: Build Aseprite Termux arm64

on:
  push:
    branches: [ci-arm64]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Pull Termux image
        run: docker pull termux/termux-docker:aarch64

      - name: Build inside Termux (bionic) container
        run: |
          LOG="${GITHUB_WORKSPACE}/build.log"
          set +e
          docker run --name termux-build termux/termux-docker:aarch64 \
            bash -c '
              set -e
              export GIT_SYNC_DEPS_SKIP_EMSDK=true
              export HOME="$TMPDIR"
              apt update -y -q
              apt install -y -q x11-repo || true
              apt install -y -q \
                ca-certificates cmake ninja clang git python gn pkg-config unzip \
                libx11 libxcursor libxi libxrandr libglvnd libglvnd-dev fontconfig
              # Ensure the dev symlink exists for libGL (Termux package may
              # only ship libGL.so.1; pick whichever file is present).
              ls -la /data/data/com.termux/files/usr/lib/libGL* 2>&1 || true
              GL_LIB=$(ls /data/data/com.termux/files/usr/lib/libGL.so.1* 2>/dev/null | head -1)
              if [ -z "$GL_LIB" ]; then
                GL_LIB=$(ls /data/data/com.termux/files/usr/lib/libGL.so* 2>/dev/null | head -1)
              fi
              echo "GL_LIB=$GL_LIB"
              echo "### apt install done"

              cd "$TMPDIR"
              git clone https://github.com/aseprite/aseprite.git aseprite
              cd aseprite
              git checkout 844304553
              git submodule update --init --recursive
              # bionic (Android) has no aligned_alloc; use posix_memalign.
              sed -i "s/return aligned_alloc(alignment, bytes);/void* p = nullptr; return (posix_memalign(\&p, alignment, bytes) == 0) ? p : nullptr;/" laf/base/memory.cpp
              # bionic (Android) has no pthread_getname_np; use prctl(PR_GET_NAME).
              sed -i "s/#include <pthread.h>/#include <pthread.h>\n#include <sys\/prctl.h>/" laf/base/thread.cpp
              sed -i "s/const int result = pthread_getname_np(pthread_self(), name, sizeof(name) - 1);/#ifdef __ANDROID__\n  const int result = prctl(PR_GET_NAME, name, sizeof(name) - 1);\n#else\n  const int result = pthread_getname_np(pthread_self(), name, sizeof(name) - 1);\n#endif/" laf/base/thread.cpp
              cd "$TMPDIR"
              echo "### aseprite cloned"

              git clone -b aseprite-m124 https://github.com/aseprite/skia.git
              cd skia
              # Termux clang defines __ANDROID__, so SkDebug_stdio.cpp compiles
              # to an empty file, but gn builds skia as plain Linux (no
              # SkDebug_android.cpp). Restore a stderr SkDebugf implementation.
              sed -i "s/#if !defined(SK_BUILD_FOR_WIN) && !defined(SK_BUILD_FOR_ANDROID)/#if !defined(SK_BUILD_FOR_WIN)/" src/ports/SkDebug_stdio.cpp
              # Termux python reports sys.platform android, which crashes
              # the skia bin/fetch-gn helper. We do not need it: gn comes
              # from the Termux package (installed via apt above).
              : > bin/fetch-gn
              python3 tools/git-sync-deps
              echo "### skia deps synced"
              gn gen out/Release-arm64 --args="is_debug=false is_official_build=true skia_use_system_expat=false skia_use_system_icu=false skia_use_system_libjpeg_turbo=false skia_use_system_libpng=false skia_use_system_libwebp=false skia_use_system_zlib=false skia_use_freetype=true skia_use_harfbuzz=true skia_pdf_subset_harfbuzz=true skia_use_system_freetype2=false skia_use_system_harfbuzz=false cc=\"clang\" cxx=\"clang++\""
              ninja -C out/Release-arm64 skia modules
              echo "### skia built"
              cd "$TMPDIR"

              cmake -S aseprite -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DLAF_BACKEND=skia \
                -DSKIA_DIR="$TMPDIR/skia" \
                -DSKIA_LIBRARY_DIR="$TMPDIR/skia/out/Release-arm64" \
                -DSKIA_OPENGL_LIBRARY="$GL_LIB"
              echo "### cmake configured"
              cmake --build build --target aseprite
              echo "### aseprite built"

              strip build/bin/aseprite
              tar -czf "$TMPDIR/aseprite-linux-arm64.tar.gz" -C build/bin aseprite data
              ls -lh "$TMPDIR/aseprite-linux-arm64.tar.gz"
              echo "### packaged"
            ' >"$LOG" 2>&1
          STATUS=$?
          docker cp termux-build:/data/data/com.termux/files/usr/tmp/aseprite-linux-arm64.tar.gz "${GITHUB_WORKSPACE}/" 2>/dev/null || true
          docker rm -f termux-build >/dev/null 2>&1 || true
          echo "workspace contents:"; ls -la "${GITHUB_WORKSPACE}" || true
          echo "log file:"; ls -la "$LOG" 2>&1 || true
          tail -100 "$LOG"
          exit $STATUS

      - name: Publish to ci-artifacts branch
        if: always()
        env:
          CI_DEPLOY_KEY: ${{ secrets.CI_DEPLOY_KEY }}
        run: |
          set +e
          {
            git config --global user.name "ci-bot"
            git config --global user.email "ci-bot@users.noreply.github.com"
            echo "GITHUB_TOKEN_LEN=${#GITHUB_TOKEN}"
            echo "CI_DEPLOY_KEY_LEN=${#CI_DEPLOY_KEY}"
            echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY}"
            mkdir -p /tmp/pub && cd /tmp/pub
            git init -q
            git checkout -q -b ci-artifacts
            { echo "workspace: ${GITHUB_WORKSPACE}"; ls -la "${GITHUB_WORKSPACE}"; } > diag.txt 2>&1 || true
            git add diag.txt
            if [ -f "${GITHUB_WORKSPACE}/build.log" ]; then
              cp "${GITHUB_WORKSPACE}/build.log" .
              git add build.log
            fi
            if [ -f "${GITHUB_WORKSPACE}/aseprite-linux-arm64.tar.gz" ]; then
              cp "${GITHUB_WORKSPACE}/aseprite-linux-arm64.tar.gz" .
              git add aseprite-linux-arm64.tar.gz
            fi
            if git diff --cached --quiet; then
              echo "Nothing to publish."
              PUB_STATUS=0
            else
              git commit -q -m "aseprite-linux-arm64 from ${GITHUB_SHA}"
              if [ -n "${CI_DEPLOY_KEY}" ]; then
                mkdir -p ~/.ssh
                printf '%s\n' "${CI_DEPLOY_KEY}" > ~/.ssh/id_ci
                chmod 600 ~/.ssh/id_ci
                export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ci -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null"
                git remote add origin "git@github.com:${GITHUB_REPOSITORY}.git"
                git push -q -f origin ci-artifacts
              else
                git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
                git push -q -f origin ci-artifacts
              fi
              PUB_STATUS=$?
              git ls-remote origin ci-artifacts
            fi
          } > "${GITHUB_WORKSPACE}/publish.log" 2>&1
          STATUS=${PUB_STATUS:-1}
          tail -100 "${GITHUB_WORKSPACE}/publish.log"
          exit $STATUS

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-linux-arm64
          path: |
            aseprite-linux-arm64.tar.gz
            build.log
            publish.log
          if-no-files-found: warn
